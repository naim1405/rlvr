# Qwen PEFT/LoRA SFT recipe for output format learning.
#
# This file is the TEMPLATE/default (Qwen3-0.6B). The launch wrappers
# (run_in_container.sh) first render a per-run copy with render_recipe.py -
# rewriting the model id, the absolute container paths below, and batch
# sizes - then run `automodel` on the rendered file. You should not need
# to hand-edit this file to change the model.
#
# Canonical layout inside ANY container (Docker locally, Singularity on
# the cluster): the repo is bind-mounted at /workspace/rlvr, so
#   /workspace/rlvr/0.peft/
#     recipe.yaml
#     mydataset.py
#     dataset/
#       train.jsonl
#
# Direct use inside a container mounted exactly like that still works:
#   automodel /workspace/rlvr/0.peft/recipe.yaml
# or multi-GPU:
#   automodel --nproc-per-node=<NUM_GPUS> /workspace/rlvr/0.peft/recipe.yaml

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 32
  local_batch_size: 4
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 2

# NCCL is required for GPU training. Increase timeout to avoid false failures
# during first HF model download/load.
dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-0.6B
  torch_dtype: bf16
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: /workspace/rlvr/0.peft/checkpoints
  model_save_format: safetensors
  # For PEFT this saves adapter weights under epoch_*/model/.
  # Consolidated full-model checkpoints are for full SFT, not LoRA adapters.
  save_consolidated: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  # Qwen projection modules include q_proj/k_proj/v_proj/o_proj/gate_proj/up_proj/down_proj.
  target_modules: '*_proj'
  dim: 32
  alpha: 64
  dropout: 0.05
  use_triton: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: /workspace/rlvr/0.peft/mydataset.py:QwenPEFTDataset
  path: /workspace/rlvr/0.peft/dataset/train.jsonl
  split: train
  validation_fraction: 0.02
  max_length: 2048
  include_system_prompt: false

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true
  group_by_length: true

validation_dataset:
  _target_: /workspace/rlvr/0.peft/mydataset.py:QwenPEFTDataset
  path: /workspace/rlvr/0.peft/dataset/train.jsonl
  split: validation
  validation_fraction: 0.02
  max_length: 2048
  include_system_prompt: false
  num_samples_limit: 1024

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 2.0e-4
  weight_decay: 0

ci:
  recipe_owner: local
