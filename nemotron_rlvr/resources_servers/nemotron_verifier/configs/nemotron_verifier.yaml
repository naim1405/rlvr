# Single Gym resources server for all seven RLVR families (P0–P6).
# Inner key `nemotron_verifier` is the directory Gym looks up:
#   $GYM_ROOT/resources_servers/nemotron_verifier/
#
# Pair with the bundled vLLM model yaml:
#   responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
# (or configs/models/policy_model.yaml in this repo).

nemotron_verifier:
  resources_servers:
    nemotron_verifier:
      entrypoint: app.py
      domain: other
      verified: false
      description: P0–P6 RLVR verifiers (retrieval, arithmetic, symbolic, logic, planning, pattern, constraint)
      reward_params:
        p0_retrieval:
          normalize: default
        p1_arithmetic:
          tolerance: 1.0e-5

nemotron_verifier_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: nemotron_verifier
      model_server:
        type: responses_api_models
        name: policy_model
